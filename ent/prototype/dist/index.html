s|6e":[{teacher:"Mme MIRANA",items:["Lire et comprendre des textes narratifs en identifiant personnages, lieux, événements et chronologie","Rédiger des phrases simples ou complexes","Employer correctement les adjectifs qualificatifs et accorder les mots","Conjuguer les verbes aux temps de l'indicatif (présent, passé, futur)","Respecter l'orthographe et la ponctuation","Observer et décrire une illustration ou une œuvre liée au texte étudié"]},{teacher:"Mme MIRANA",items:["Lire, comprendre et écrire un conte imaginaire","Identifier les personnages, les éléments merveilleux et les étapes du récit","Développer l'imagination à travers la lecture et l'écriture d'un conte","Théâtre : découvrir les caractéristiques du texte théâtral","Comprendre un dialogue et les effets comiques","Lire et interpréter un extrait de pièce (Le médecin malgré lui de Molière)"]},{teacher:"Mme MIRANA",items:["Genre théâtral : Lire, comprendre, interpréter et produire des textes théâtraux en identifiant les caractéristiques du genre (dialogues, didascalies, actes et scènes) à travers l'étude d'œuvres telles que Le Médecin malgré lui","Genre narratif (le récit d'aventure) : Lire, comprendre, interpréter et produire des récits d'aventure en identifiant les étapes du récit, les personnages et les péripéties à travers l'étude d'œuvres telles que Robinson Crusoé","Lexique et grammaire : Maîtriser les notions fondamentales de la langue en distinguant la phrase simple et la phrase complexe ; appliquer correctement l'accord du verbe avec son sujet ainsi que l'accord du participe passé et de l'adjectif qualificatif dans les productions orales et écrites"]}],"Histoire-géographie|6e":[{teacher:"Mme FELANA",items:["Se repérer dans le temps et l'espace","Lire, analyser et comprendre différents documents","Utiliser divers langages de représentation","Raisonner, justifier, argumenter et chercher l'information dans un environnement numérique","Travailler en coopération"]},{teacher:"Mme FELANA",items:["Se repérer dans le temps et dans l'espace","Raisonner, justifier une démarche et les choix effectués","Pratiquer les différents langages en Histoire et en Géographie","Analyser et comprendre un document"]},{teacher:"Mme FELANA",items:["Se repérer dans le temps et dans l'espace","Analyser et comprendre un document","Pratiquer différents langages (écrits, graphiques, cartographiques)","Raisonner et justifier une démarche scientifique","Coopérer et mutualiser le travail au sein d'un groupe"]}],"Mandarin|6e":[{teacher:"Mme LANTO",items:["Reconnaître et utiliser les quatre tons","Lire et écrire des mots courants","Employer les salutations de base et se présenter oralement","Lire, écrire et utiliser les nombres de 1 à 100 en caractères chinois","Comprendre des mots liés aux thèmes abordés comme Noël"]},{teacher:"Mme LANTO",items:["Se présenter globalement, parler de ses loisirs et de sa famille, et écrire des phrases simples et des caractères chinois"]},{teacher:"Mme LANTO",items:["Parler de sa routine quotidienne en mandarin","Lire et comprendre un texte simple en utilisant correctement le vocabulaire étudié","Améliorer la prononciation grâce au chant et à la lecture","Développer l'expression orale et la compréhension écrite"]}],"Mathématiques|6e":[{teacher:"M. ESMANE RJ",items:["Lire, écrire et utiliser les nombres entiers et décimaux (écriture décimale ou fractionnaire)","Effectuer des additions, soustractions et multiplications","Mesurer des distances, identifier un cercle et travailler sur les droites parallèles, sécantes ou perpendiculaires"]},{teacher:"M. ESMANE RJ",items:["Angles : connaître et utiliser la notion d'angle ; mesurer des angles et identifier leurs types (catégories)","Scratch : réaliser des programmes de calcul en utilisant les opérateurs mathématiques et une variable aléatoire","Proportionnalité : reconnaître une situation de proportionnalité et en comprendre l'objectif"]},{teacher:"M. ESMANE RJ",items:["Identifier des grandeurs et leurs unités","Identifier d
